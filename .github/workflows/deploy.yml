name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# El token de Vercel y los ids del proyecto se leen de los secretos de GitHub.
# Si falta alguno, se avisa con el nombre exacto en vez de fallar con un error
# de Vercel que no dice qué falta.
env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Falla aqui, antes de instalar nada, y dice qué falta y dónde
      # conseguirlo. Sin esto el fallo real es un error de Vercel que no
      # menciona los secretos, y se pierde tiempo buscando el problema
      # equivocado.
      - name: Comprobar secretos
        run: |
          faltan=""
          [ -z "$VERCEL_TOKEN" ]      && faltan="$faltan VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ]     && faltan="$faltan VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && faltan="$faltan VERCEL_PROJECT_ID"
          if [ -n "$faltan" ]; then
            {
              echo "::error::Faltan estos secretos en GitHub Actions:$faltan"
              echo ""
              echo "Donde conseguirlos:"
              echo "  VERCEL_TOKEN      -> Vercel > tu cuenta > Settings > Tokens > Create."
              echo "                      Marcá 'Full Account' si el proyecto es de una organizacion."
              echo "  VERCEL_ORG_ID     -> Vercel > el proyecto > Settings > General."
              echo "  VERCEL_PROJECT_ID -> Vercel > el proyecto > Settings > General."
              echo ""
              echo "Donde pegarlos: este repositorio > Settings > Secrets and variables"
              echo "> Actions > New repository secret. Repetir una vez por cada nombre."
              echo ""
              echo "Con eso esta todo. No hace falta configurar nada mas."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Faltan:$faltan"
            exit 1
          fi
          echo "Secretos completos."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Sin estos dos, `vercel pull` responde "No Project Settings found
      # locally": la carpeta .vercel/ está en .gitignore y nunca viaja al runner.
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-supabase-functions:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy report and expense reminder functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Configure SUPABASE_PROJECT_ID in GitHub Actions secrets."
            exit 1
          fi
          supabase functions deploy weekly-report --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy expense-reminders --project-ref "$SUPABASE_PROJECT_ID"